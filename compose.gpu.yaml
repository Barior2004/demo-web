services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    image: demo-web:gpu-optimized
    container_name: demo-web-gpu
    restart: unless-stopped
    init: true
    gpus: all
    ports:
      - "8501:8501"
    environment:
      YOLO_CONFIG_DIR: /tmp/Ultralytics
      MODEL_PATH: /app/models/yolov10n_final_coordattn.onnx
      BENCHMARK_DB_PATH: /app/data/benchmarks.db
    volumes:
      - ./models/yolov10n_final_coordattn.onnx:/app/models/yolov10n_final_coordattn.onnx:ro
      - ./data:/app/data
