name: CI checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Python and Docker configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check Python syntax
        run: python3 -m compileall -q app.py benchmark_core tests

      - name: Validate benchmark configuration
        run: python3 -c "from benchmark_core.config import validate_config; validate_config(); print('Benchmark config OK')"

      - name: Install video output test dependencies
        run: python3 -m pip install imageio-ffmpeg==0.6.0 numpy==2.2.3

      - name: Test annotated video output
        run: python3 -m unittest discover -s tests -v

      - name: Check EC2 deployment script syntax
        run: bash -n deploy-ec2.sh

      - name: Validate GPU Compose file
        run: docker compose -f compose.gpu.yaml config --quiet

      - name: Check CPU Dockerfile
        run: docker buildx build --check -f Dockerfile .

      - name: Check GPU Dockerfile
        run: docker buildx build --check -f Dockerfile.gpu .
